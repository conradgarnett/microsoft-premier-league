[project]
name = "tactical-replay"
version = "0.1.0"
description = "3D Tactical Replay: synthetic football match engine, analytics, multi-agent explanations and a broadcast-style 3D replay viewer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-dotenv>=1.0",
  "mcp>=1.24",
  "agent-framework-core>=1.22",
]

[project.optional-dependencies]
azure = [
  "agent-framework-openai>=1.0",
  "azure-identity>=1.15",
  "azure-cosmos>=4.5",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "scipy>=1.11", "opencv-python-headless>=4.9"]  # vision tests (no torch)
# video-to-schema pipeline (vision/): heavy, not needed by the app or tests
vision = ["torch>=2.2", "transformers>=4.50", "opencv-python-headless>=4.9", "av>=12", "scipy>=1.11", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*", "analytics*", "agents*", "mcp_server*", "api*"]

[tool.setuptools.package-data]
"sim.mocap" = ["library.npz"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # vision/ is a script package, not installed
filterwarnings = ["ignore::DeprecationWarning"]
