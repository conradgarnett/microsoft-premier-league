# docker compose up --build  ->  http://localhost:8000  (viewer + API), MCP at http://localhost:8001/mcp
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]
    volumes: [matches:/data/matches]
  mcp:
    build: .
    command: ["python", "-m", "mcp_server", "--http", "8001"]
    ports: ["8001:8001"]
    env_file: [{ path: .env, required: false }]
    volumes: [matches:/data/matches]
    depends_on: [app]
volumes:
  matches:
